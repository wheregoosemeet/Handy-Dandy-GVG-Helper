<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GvG Toolkit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:   #e8c86a;
    --gold-2: #c99b3f;
    --jade:   #6fd0ab;
    --ink:    #0a0d12;
  }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1100px 700px at 50% -8%, #1b2735 0%, transparent 60%),
      radial-gradient(900px 600px at 12% 108%, rgba(111,208,171,0.14) 0%, transparent 55%),
      radial-gradient(900px 600px at 88% 100%, rgba(232,200,106,0.12) 0%, transparent 55%),
      linear-gradient(160deg, #0b0f16 0%, #070a0f 55%, #05070a 100%);
    color: #f3ecdd;
    font-family: "Optima", "Georgia", "Songti SC", "STSong", serif;
    overflow: hidden;
    position: relative;
    padding: 24px;
  }

  /* ── Giant faint 風 (wind) watermark ─────────────────────────── */
  .kanji {
    position: absolute;
    right: -3vw; bottom: -8vh;
    font-size: 62vh;
    line-height: 1;
    color: rgba(232,200,106,0.05);
    font-weight: 700;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 60px rgba(232,200,106,0.06);
  }
  .kanji.left {
    right: auto; left: -4vw; top: -12vh; bottom: auto;
    color: rgba(111,208,171,0.045);
  }

  /* ── Drifting embers / wind motes ─────────────────────────────── */
  .motes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .mote {
    position: absolute; bottom: -20px;
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px 1px rgba(232,200,106,0.7);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    12%  { opacity: 0.9; }
    88%  { opacity: 0.8; }
    100% { transform: translateY(-108vh) translateX(40px); opacity: 0; }
  }

  /* thin drifting wind streaks */
  .wind { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .streak {
    position: absolute;
    height: 1px; width: 240px;
    background: linear-gradient(90deg, transparent, rgba(243,236,221,0.25), transparent);
    animation: blow linear infinite;
    opacity: 0;
  }
  @keyframes blow {
    0%   { transform: translateX(-260px); opacity: 0; }
    20%  { opacity: 0.7; }
    80%  { opacity: 0.6; }
    100% { transform: translateX(110vw); opacity: 0; }
  }

  /* ── Center stack ─────────────────────────────────────────────── */
  .wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 100%;
    max-width: 940px;
  }

  .eyebrow {
    font-size: 0.82rem;
    letter-spacing: 0.62em;
    text-transform: uppercase;
    color: var(--jade);
    margin-left: 0.62em;
    margin-bottom: 18px;
    opacity: 0.85;
  }

  h1 {
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    font-weight: 700;
    letter-spacing: 0.16em;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fbf3df 0%, var(--gold) 55%, var(--gold-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 40px rgba(232,200,106,0.18);
  }

  .rule {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 14px auto 46px;
    color: var(--gold);
  }
  .rule::before, .rule::after {
    content: ""; height: 1px; width: 120px;
    background: linear-gradient(90deg, transparent, var(--gold-2));
  }
  .rule::after { background: linear-gradient(90deg, var(--gold-2), transparent); }
  .rule .diamond { font-size: 0.7rem; opacity: 0.85; }

  /* ── Buttons ──────────────────────────────────────────────────── */
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
  }
  @media (max-width: 680px) { .buttons { grid-template-columns: 1fr; } }

  .plate {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 46px 28px;
    min-height: 230px;
    text-decoration: none;
    color: #f3ecdd;
    border: 1px solid rgba(232,200,106,0.35);
    border-radius: 16px;
    background:
      linear-gradient(180deg, rgba(28,34,44,0.72), rgba(12,16,22,0.82));
    box-shadow:
      0 18px 50px rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.02),
      inset 0 1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
    isolation: isolate;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s, box-shadow .25s;
  }

  /* ornamental corner ticks */
  .plate::before {
    content: "";
    position: absolute; inset: 10px;
    border: 1px solid rgba(232,200,106,0.18);
    border-radius: 10px;
    pointer-events: none;
  }
  /* gold shimmer sweep on hover */
  .plate::after {
    content: "";
    position: absolute; top: 0; left: -120%;
    width: 80%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(232,200,106,0.18), transparent);
    transform: skewX(-18deg);
    transition: left .7s ease;
    z-index: 3;
  }
  .plate:hover {
    transform: translateY(-8px);
    border-color: var(--gold);
    box-shadow:
      0 26px 60px rgba(0,0,0,0.6),
      0 0 34px rgba(232,200,106,0.25),
      inset 0 0 0 1px rgba(232,200,106,0.15);
  }
  .plate:hover::after { left: 130%; }
  .plate:active { transform: translateY(-3px) scale(0.995); }

  .plate .icon {
    font-size: 3rem;
    line-height: 1;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.5));
  }
  .plate .label {
    font-size: clamp(1.5rem, 3.4vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.14em;
    background: linear-gradient(180deg, #fdf6e4, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .plate .sub {
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9fb0ad;
  }

  /* jade accent on the roster plate */
  .plate.jade { border-color: rgba(111,208,171,0.35); }
  .plate.jade::before { border-color: rgba(111,208,171,0.18); }
  .plate.jade:hover {
    border-color: var(--jade);
    box-shadow:
      0 26px 60px rgba(0,0,0,0.6),
      0 0 34px rgba(111,208,171,0.25),
      inset 0 0 0 1px rgba(111,208,171,0.15);
  }
  .plate.jade::after { background: linear-gradient(100deg, transparent, rgba(111,208,171,0.18), transparent); }
  .plate.jade .label { background: linear-gradient(180deg, #eafff6, var(--jade)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .footnote {
    margin-top: 40px;
    font-size: 0.8rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(243,236,221,0.45);
    line-height: 1.9;
  }
  .footnote .highlight {
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.3em;
  }
  .footnote .dedication {
    display: block;
    margin-top: 12px;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: rgba(111,208,171,0.6);
    line-height: 2;
  }
</style>
</head>
<body>

  <div class="kanji">風</div>
  <div class="kanji left">會</div>

  <div class="wind" id="wind"></div>
  <div class="motes" id="motes"></div>

  <main class="wrap">
    <div class="eyebrow">Where Winds Meet</div>
    <h1>GvG Toolkit</h1>
    <div class="rule"><span class="diamond">◆</span></div>

    <nav class="buttons">
      <a class="plate" href="Handy Dandy GVG Helper v6.html">
        <span class="icon">⏱️</span>
        <span class="label">GvG Timer</span>
        <span class="sub">Jungle &amp; boss callouts</span>
      </a>

      <a class="plate jade" href="GVG Roster Builder3.html">
        <span class="icon">⚔️</span>
        <span class="label">Roster Builder</span>
        <span class="sub">Draft &amp; assign your teams</span>
      </a>
    </nav>

    <div class="footnote">
      For the best guild: <span class="highlight">OnlyGeese</span>
      <span class="dedication">Dedicated to the best team:<br>Pepper · Theoss · Schizodude · Wifelover · Shakulina</span>
    </div>
  </main>

<script>
  // Spawn drifting embers
  const motes = document.getElementById("motes");
  for (let i = 0; i < 26; i++){
    const m = document.createElement("span");
    m.className = "mote";
    m.style.left = Math.random() * 100 + "%";
    const dur = 9 + Math.random() * 10;
    m.style.animationDuration = dur + "s";
    m.style.animationDelay = (-Math.random() * dur) + "s";
    const scale = 0.6 + Math.random() * 1.6;
    m.style.transform = `scale(${scale})`;
    if (Math.random() < 0.4){                       // some jade motes
      m.style.background = "#6fd0ab";
      m.style.boxShadow = "0 0 8px 1px rgba(111,208,171,0.7)";
    }
    motes.appendChild(m);
  }

  // Spawn thin wind streaks
  const wind = document.getElementById("wind");
  for (let i = 0; i < 7; i++){
    const s = document.createElement("span");
    s.className = "streak";
    s.style.top = (6 + Math.random() * 88) + "%";
    const dur = 7 + Math.random() * 8;
    s.style.animationDuration = dur + "s";
    s.style.animationDelay = (-Math.random() * dur) + "s";
    s.style.width = (150 + Math.random() * 220) + "px";
    wind.appendChild(s);
  }
</script>
</body>
</html>
